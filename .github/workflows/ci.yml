name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: valaxy-vsix-${{ matrix.os }}
          path: '*.vsix'
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
  editor-protocol:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the public protocol implementation
        uses: actions/checkout@v4
        with:
          repository: YunYouJun/valaxy
          # Update to a released framework version once the companion PR ships.
          ref: eb386e7cbfb1d3ee23b043286500d611f5a4b387
          path: .valaxy-framework
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .valaxy-framework/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the framework
        working-directory: .valaxy-framework
        run: pnpm install --frozen-lockfile && pnpm run build
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
          VALAXY_TEST_CAPABILITIES: '1'
          VALAXY_CLI_PATH: ${{ github.workspace }}/.valaxy-framework/packages/valaxy/bin/valaxy.mjs
